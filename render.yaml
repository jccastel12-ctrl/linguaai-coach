# LinguaAI Coach - staging Blueprint for Render
# Public HTTPS preview for browser and mobile testing.

services:
  - type: web
    name: linguaai-coach-api
    runtime: python
    plan: free
    region: virginia

    buildCommand: pip install -r apps/api/requirements.txt

    startCommand: cd apps/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers

    healthCheckPath: /health/ready

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: ENVIRONMENT
        value: staging

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: linguaai-coach-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: ""

      - key: AI_PROVIDER
        value: rule_based

      - key: PAYMENT_PROVIDER
        value: disabled

      - key: EMAIL_DELIVERY_MODE
        value: disabled

  - type: web
    name: linguaai-coach-web
    runtime: node
    plan: free
    region: virginia

    buildCommand: npm ci --no-audit --no-fund && npm run build:web

    startCommand: npm run start --workspace @linguaai/web -- --hostname 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: 20.18.0

      - key: API_INTERNAL_URL
        fromService:
          name: linguaai-coach-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: linguaai-coach-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: linguaai
    user: linguaai
