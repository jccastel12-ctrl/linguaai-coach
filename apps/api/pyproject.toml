[project]
name = "linguaai-api"
version = "1.0.0"
description = "LinguaAI Coach - backend API (FastAPI)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]
"app/core/config.py" = ["S105"]
"app/domains/auth/service.py" = ["S105", "S106"]
"app/domains/auth/schemas.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
